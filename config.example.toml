# Copy to config.toml and replace the source paths with the mounted drives.
# Credentials and crypt passwords live only in rclone's configuration.
remote = "obu-crypt:"
# Leave host blank to use this computer's hostname; set it to keep names stable.
host = ""
state_dir = "~/.local/state/obu"
verify = true
# systemd OnCalendar expression; applied when you rerun ./obu install.
schedule = "*-*-* 02:30:00"

# Primary drive
[sources.primary]
path = "/media/REPLACE_ME/primary"
filters = ["common", "primary", "vm_images"]

# Secondary drive
[sources.secondary]
path = "/media/REPLACE_ME/secondary"
filters = ["common", "secondary", "vm_images"]

# Tertiary drive
[sources.tertiary]
path = "/media/REPLACE_ME/tertiary"
filters = ["common", "tertiary", "vm_images"]

# Rules use rclone's filter syntax and run in the listed order. Keep any
# specific re-inclusions above an exclusion that would otherwise match them.
[filters.common]
rules = [
  # Disposable cache directories/files at any depth. These apply by name;
  # databases, mail, and persistent application storage need separate review.
  "- Cache/**",
  "- Code Cache/**",
  "- GPUCache/**",
  "- Dawn*Cache/**",
  "- htmlcache/**",
  "- folderCache.json",
  "- **/.local/state/obu/**",
  "- .DS_Store",
  "- Thumbs.db",
  "- **/.Trash/**",
  "- **/.cache/**",
  "- **/node_modules/**",
  "- **/__pycache__/**",
  "- **/*.pyc",
  "- **/*.tmp",
  "- **/*~",
]

[filters.primary]
rules = [
  # Add source-specific exclusions here after reviewing what can be recreated.
  "- /lost+found/**",
]

[filters.secondary]
rules = [
  # "- /Scratch/**",
  "- /lost+found/**",
]

[filters.tertiary]
rules = [
  # Exclude filesystem recovery metadata.
  "- /lost+found/**",
]

# Probe matching images wherever they occur in a selected source. A failed
# image lock/access check temporarily excludes only that image for this run.
# Broad .img/.raw extensions can also match non-VM disk images; edit as needed.
[filters.vm_images]
vm_image_extensions = [".qcow", ".qcow2", ".qed", ".vmdk", ".vdi", ".vhd", ".vhdx", ".img", ".raw"]
rules = []
